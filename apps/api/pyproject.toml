[project]
name = "ledgerlens-api"
version = "0.1.0"
description = "FastAPI application: auth, tenancy, documents, models, production."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ledgerlens-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens_api"]

[tool.uv.sources]
ledgerlens-core = { workspace = true }
