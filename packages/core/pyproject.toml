[project]
name = "ledgerlens-core"
version = "0.1.0"
description = "Domain model, migrations, repositories, settings, object store and job runtime."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "redis>=5.2",
  "celery>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens_core"]
