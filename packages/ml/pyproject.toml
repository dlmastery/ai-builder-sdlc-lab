[project]
name = "ledgerlens-ml"
version = "0.1.0"
description = "OCR adapter, extractor, verifier, calibration, difficulty, probes, eval, synthetic data."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ledgerlens-core",
  "numpy>=2.1",
  "pillow>=11.0",
]

[project.optional-dependencies]
gpu = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens_ml"]

[tool.uv.sources]
ledgerlens-core = { workspace = true }
