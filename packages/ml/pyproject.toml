[project]
name = "ledgerlens-ml"
version = "0.1.0"
description = "OCR adapter, extractor, verifier, calibration, difficulty, probes, eval, synthetic data."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ledgerlens-core",
  "numpy>=2.1",
  "pillow>=11.0",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
# Real models. Installed in the GPU worker image and in the native GPU venv (`uv sync --extra gpu`).
gpu = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=5.0",
  "accelerate>=1.3",
  "peft>=0.15",
  "bitsandbytes>=0.45",
  "safetensors>=0.5",
  "datasets>=3.2",
  "huggingface-hub>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens_ml"]

[tool.uv.sources]
ledgerlens-core = { workspace = true }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
